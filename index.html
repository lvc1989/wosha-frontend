<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wosha</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="theme-color" content="#2B6CF6" />
  <style>
    /* Shown the instant the HTML arrives, before any JS has downloaded or run —
       this is what makes the app feel like it "opens fast" even on a slow
       connection, since there's no blank white flash while the real bundle loads.
       Uses the default blue; once React mounts, main.jsx removes this and the
       real branded screen (with the owner's actual customized color/logo) takes
       over seamlessly. */
    #wosha-boot-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #2B6CF6; font-family: system-ui, -apple-system, sans-serif;
    }
    #wosha-boot-splash .mark {
      width: 76px; height: 76px; border-radius: 20px; background: #0B1B33;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 34px; color: #FFC93C; margin-bottom: 18px;
    }
    #wosha-boot-splash .spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.35); border-top-color: #fff;
      animation: wosha-spin 0.8s linear infinite; margin-top: 22px;
    }
    @keyframes wosha-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="wosha-boot-splash">
    <div class="mark">W</div>
    <div class="spinner"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
